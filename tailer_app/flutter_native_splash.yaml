flutter_native_splash:
  # Professional Teal Background (matches app theme)
  color: "#0D7377"  # Deep Teal - Professional tailor brand color
  
  # App icon/logo for splash screen
  # TO CUSTOMIZE: Replace with your own logo
  # Add image to: assets/images/splash_icon.png (1024x1024 recommended)
  image: assets/icon/app_icon.png
  
  # Android 12+ specific configuration
  android_12:
    image: assets/icon/app_icon.png
    icon_background_color: "#0D7377"  # Deep Teal background (matches main theme)
    color: "#0D7377"  # Deep Teal background (matches main theme)
  
  # iOS configuration
  ios: true
  
  # Web configuration
  web: false
  
  # Remove native splash quickly to show our custom animation
  android: true
  
  # Fullscreen mode
  fullscreen: true
  
  # Info.plist modifications for iOS
  info_plist_files:
    - 'ios/Runner/Info.plist'

